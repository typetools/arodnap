# Repair with an output directory and no field transformations, edit the source, then apply:
# apply must refuse the changed file.
invoker.goals.1 = compile ${project.groupId}:${project.artifactId}:${project.version}:repair -Darodnap.outputDirectory=target/custom -Darodnap.fieldTransformations=off
invoker.goals.2 = org.apache.maven.plugins:maven-antrun-plugin:3.1.0:run@change
invoker.goals.3 = ${project.groupId}:${project.artifactId}:${project.version}:apply -Darodnap.outputDirectory=target/custom
invoker.buildResult.3 = failure
