# Every goal writes its output; with arodnap.skip, repair and doctor do nothing.
invoker.goals.1 = compile ${project.groupId}:${project.artifactId}:${project.version}:doctor
invoker.goals.2 = ${project.groupId}:${project.artifactId}:${project.version}:analyze -Darodnap.outputDirectory=target/analyze
invoker.goals.3 = ${project.groupId}:${project.artifactId}:${project.version}:infer -Darodnap.outputDirectory=target/infer
invoker.goals.4 = ${project.groupId}:${project.artifactId}:${project.version}:repair -Darodnap.skip=true -Darodnap.outputDirectory=target/skipped
invoker.goals.5 = ${project.groupId}:${project.artifactId}:${project.version}:doctor -Darodnap.skip=true -Darodnap.outputDirectory=target/skipped
