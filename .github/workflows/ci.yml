name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m unittest discover -s tests -p "test_*.py"

  java-tools:
    name: Java tools (build, test, match committed jars)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and test every Java tool
        run: python scripts/java_tools.py build
      - name: Check the committed jars match the source
        run: python scripts/java_tools.py check

  e2e:
    name: End-to-end (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The LTS releases developers run.
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - name: Install Maven and Ant if missing
        run: |
          missing=()
          command -v mvn >/dev/null || missing+=(maven)
          command -v ant >/dev/null || missing+=(ant)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "${missing[@]}"
          fi
      - name: Tool versions
        run: |
          java -version
          gradle --version
          mvn --version
          ant -version
      - name: Real end-to-end repairs
        env:
          ARODNAP_E2E: "1"
        shell: bash
        run: |
          python -m unittest -v tests.test_e2e_real 2>&1 | tee e2e.log
          # A missing tool skips its test. Every tool is installed here, so a skip is a setup bug.
          if grep -q " skipped " e2e.log; then
            echo "::error::an end-to-end test was skipped"
            exit 1
          fi
