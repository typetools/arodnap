name: Release

# Pushing a version tag (v2.0.0) releases that version: the Maven artifacts to Maven Central, then
# the Gradle plugin to the Gradle Plugin Portal, then a draft GitHub release with the command-line
# distribution attached. See docs/releasing.md for the secrets it needs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - name: Check the tag names the version in the build
        run: |
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the build's version $version"
            exit 1
          fi
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -P release deploy
      - name: Publish the Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >-
          gradle -p arodnap-gradle-plugin --console=plain publishPlugins
          -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Arodnap ${GITHUB_REF_NAME#v}"
          arodnap-distribution/target/arodnap-*-bin.zip arodnap-distribution/target/arodnap-*-bin.tar.gz
