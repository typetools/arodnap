name: Release

# Pushing a version tag (v0.1.0) releases that version: every Maven module to Maven Central, then
# the Gradle plugin to the Gradle Plugin Portal, then a draft GitHub release with the command-line
# distribution attached. Run it by hand first as a dry run: the same build, uploaded to Central for
# validation but not published (drop it in the Central portal afterwards), and the Gradle plugin
# validated but not published. After a release, run it by hand to check the published artifacts.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: validate a release without publishing; check: repair test projects with a published release"
        type: choice
        options: [dry-run, check]
        default: dry-run
      version:
        description: "The release version, e.g. 0.1.0"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'Release' || 'Dry run' }} ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    if: github.event_name == 'push' || inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - name: Check the tag names the version in the build
        if: env.DRY_RUN == 'false'
        run: |
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the build's version $version"
            exit 1
          fi
      - name: Set the version to try
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: mvn -B -ntp -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Upload to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            # Uploaded and validated by Central, not published: drop it in the Central portal.
            mvn -B -ntp -P release deploy -Darodnap.central.autoPublish=false -Darodnap.central.waitUntil=validated
          else
            mvn -B -ntp -P release deploy
          fi
      - name: Publish the Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >-
          gradle -p arodnap-gradle-plugin --console=plain publishPlugins
          ${{ env.DRY_RUN == 'true' && '--validate-only' || '' }}
          -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
      - name: Draft the GitHub release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Arodnap ${GITHUB_REF_NAME#v}"
          arodnap-distribution/target/arodnap-*-bin.zip arodnap-distribution/target/arodnap-*-bin.tar.gz
      - name: Keep the distribution of the dry run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arodnap-${{ inputs.version }}-bin
          path: arodnap-distribution/target/arodnap-*-bin.zip

  check:
    name: Check the published ${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      # From Maven Central, the Gradle Plugin Portal and the published zip only.
      - name: Repair test projects with the published release
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/published_artifacts.py check --from central --version "$VERSION"
