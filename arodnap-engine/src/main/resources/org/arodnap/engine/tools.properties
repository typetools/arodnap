# The tools the engine runs, as Maven coordinates (group:artifact[:classifier]:version).
arodnap.group=${project.groupId}
arodnap.version=${project.version}
checkerframework.version=${checkerframework.version}
checker=org.checkerframework:checker:${checkerframework.version}
checker-qual=org.checkerframework:checker-qual:${checkerframework.version}
checker-util=org.checkerframework:checker-util:${checkerframework.version}
error-prone=com.google.errorprone:error_prone_core:with-dependencies:${errorprone.version}
error-prone-jdk17=com.google.errorprone:error_prone_core:with-dependencies:${errorprone.jdk17.version}
dataflow=io.github.eisop:dataflow-errorprone:${dataflow.version}
close-injector=${project.groupId}:arodnap-close-injector:${project.version}
owning-field-fixer=${project.groupId}:arodnap-owning-field-fixer:${project.version}
rlfixer=${project.groupId}:arodnap-rlfixer:${project.version}
rlpatcher=${project.groupId}:arodnap-rlpatcher:${project.version}
field-transformations=${project.groupId}:arodnap-field-transformations:${project.version}
ant-capture=${project.groupId}:arodnap-ant-capture:${project.version}
maven-capture=${project.groupId}:arodnap-maven-capture:${project.version}
