[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arodnap"
dynamic = ["version"]
description = "Finds and repairs resource leaks in Java projects (Gradle, Maven, Ant or any javac build)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["java", "resource leak", "program repair", "static analysis", "checker framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "Arodnap Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = []
test = []

[project.urls]
Homepage = "https://github.com/typetools/arodnap"
Paper = "https://arxiv.org/abs/2510.03461"

[project.scripts]
arodnap = "arodnap.main:main"

[tool.setuptools.dynamic]
version = { attr = "arodnap.version.__version__" }

[tool.setuptools.packages.find]
include = ["arodnap*"]
